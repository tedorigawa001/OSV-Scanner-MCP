name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 09:00 JST(00:00 UTC): 依存関係に新規公開された脆弱性を定期検出
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  test:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  realtime-process:
    # 実時間で子プロセスを動かす研究用の診断テスト。ホストの負荷と固定の5秒リースに
    # 左右されるため、既定の npm test からは外し、ここで単独に実行する
    name: Real-time process diagnostics (Node 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm test -- --project real-time-process
        env:
          OSV_REALTIME_PROCESS: "1"

  native-boundary:
    name: Native file boundary (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- src/test/utils/openedFilePath.test.ts
      - run: npm run build

  osv-scan:
    name: Vulnerability scan (OSV-Scanner)
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF を Code Scanning にアップロードするため
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=package-lock.json
