name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎週月曜 09:00 JST(00:00 UTC): 依存関係に新規公開された脆弱性を定期検出
    - cron: "0 0 * * 1"

permissions:
  contents: read

# Actionsは書き換えられるタグではなくコミットのSHAで固定する(タグの付け替えで別のコードが動かないように)。
# 更新はDependabot(github-actions)のPRで行う。脆弱性チェックで追加(2026-11-20)

jobs:
  test:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  realtime-process:
    # 実時間で子プロセスを動かす研究用の診断テスト。ホストの負荷と固定の5秒リースに
    # 左右されるため、研究のテスト範囲(npm run test:research)のうちこのprojectだけを、ここで単独に実行する
    name: Real-time process diagnostics (Node 26)
    # 研究の検証記録はpackage.json/package-lock.jsonの計測時のbytesに束縛されるため、版上げ・依存更新の後は
    # このprojectの記録照合が不一致になる(既知)。結果は表示するがCI全体の失敗にはしない(2026-11-16、利用者判断)
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run test:research -- --project real-time-process
        env:
          OSV_REALTIME_PROCESS: "1"

  native-boundary:
    name: Native file boundary (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 26]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- src/test/utils/openedFilePath.test.ts src/test/utils/exclusiveFileLock.test.ts src/test/osv/offlineCacheRecovery.test.ts
      - run: npm run build

  osv-scan:
    name: Vulnerability scan (OSV-Scanner)
    permissions:
      contents: read
      actions: read
      security-events: write # SARIF を Code Scanning にアップロードするため
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      scan-args: |-
        --lockfile=package-lock.json
